<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>svg.pathmorphing.js — v3 demo</title>
    <style>
      :root {
        --bg: #111418;
        --panel: #1a1f26;
        --accent: #4da3ff;
        --text: #e6e6e6;
        --muted: #8a93a3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid #262b33;
        font-size: 14px;
      }
      header b {
        color: var(--accent);
      }
      header span {
        color: var(--muted);
      }
      main {
        display: flex;
        gap: 24px;
        padding: 24px;
        flex: 1;
        align-items: flex-start;
      }
      .stage {
        flex: 1;
        max-width: 640px;
      }
      #scene {
        display: block;
        background: var(--panel);
        border-radius: 8px;
      }
      #dAttr {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
        word-break: break-all;
      }
      .controls {
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .controls h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .scenarios {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .scenarios button {
        text-align: left;
        font-size: 12px;
        padding: 7px 10px;
        background: transparent;
        border: 1px solid #2c3340;
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
      }
      .scenarios button:hover {
        border-color: var(--accent);
      }
      .scenarios button.active {
        background: var(--accent);
        color: #0d1117;
        border-color: var(--accent);
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button.primary {
        flex: 1;
        padding: 9px 0;
        font-size: 13px;
        background: var(--accent);
        border: none;
        border-radius: 7px;
        color: #0d1117;
        cursor: pointer;
        font-weight: 600;
      }
      button.secondary {
        padding: 9px 12px;
        font-size: 12px;
        background: transparent;
        border: 1px solid #2c3340;
        border-radius: 7px;
        color: var(--text);
        cursor: pointer;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      label.scrub {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted);
      }
      .mode {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .mode input {
        accent-color: var(--accent);
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }
      footer {
        padding: 10px 20px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <header>
      <b>svg.pathmorphing.js</b>
      <span>— path morphing plugin for svg.js v3</span>
    </header>

    <main>
      <div class="stage">
        <svg id="scene" width="560" height="560" viewbox="0 0 300 300"></svg>
        <div id="dAttr"></div>
      </div>

      <div class="controls">
        <div>
          <h3>Scenario</h3>
          <div class="scenarios" id="scenarios"></div>
        </div>

        <div>
          <h3>Scrub</h3>
          <input type="range" id="pos" min="0" max="100" value="0" />
          <label class="scrub"
            ><span id="posLabel">0%</span><span>from → to</span></label
          >
        </div>

        <div class="row">
          <button class="primary" id="play">▶ Play morph</button>
          <button class="secondary" id="reverse">⏪</button>
        </div>

        <label class="mode">
          <input type="checkbox" id="spring" /> Continuous morphing (Spring)
        </label>
        <div class="hint" id="hint">
          Play runs the selected morph A → B. Toggle <b>Spring</b> and click on
          the canvas to retarget mid-flight — the path follows continuously
          (issue #9).
        </div>
      </div>
    </main>

    <footer>
      <span id="status">ready</span>
    </footer>

    <script type="module" src="/main.js"></script>
  </body>
</html>
